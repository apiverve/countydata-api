name: apiverve_countydata
description: "County Data Lookup is a county lookup API that retrieves income, poverty rate, and life expectancy for any US county by state and county name. Paid plans add age demographics, educational attainment, health indicators, ZIP codes, and cost of living."
version: 1.2.3
homepage: https://apiverve.com/marketplace/countydata?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/countydata-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
